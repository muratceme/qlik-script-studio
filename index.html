<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Build Qlik Sense / QlikView load scripts visually, without writing code. Runs entirely in your browser." />
    <meta name="color-scheme" content="light dark" />
    <title>Qlik Script Studio</title>
    <script>
      // Apply the stored theme before React mounts to avoid a flash of the wrong theme.
      try {
        var stored = localStorage.getItem('qlik-script-studio:ui');
        var theme = stored ? JSON.parse(stored).state.theme : null;
        if (!theme || theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
